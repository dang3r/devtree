name: Devtree weekly dev sync.

on:
  schedule:
    # Run every Monday at 6 AM UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      dry_run:
        description: "Dry run (show what would be processed)"
        required: false
        default: "false"
        type: boolean

jobs:
  dataset_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr unzip rclone

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run weekly sync
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv python install 3.14
          uv sync
          chmod +x scripts/weekly_sync.sh
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            scripts/weekly_sync.sh --dry-run
          else
            scripts/weekly_sync.sh
          fi
